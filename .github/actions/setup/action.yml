# Shared job setup: pnpm install, plus the optional media toolchain (FFmpeg, chrome-headless-shell) and uv.
name: setup
description: Install Node dependencies and, on request, the media toolchain and uv.
inputs:
  media:
    description: Install FFmpeg and chrome-headless-shell.
    default: "false"
  uv:
    description: Install uv and sync the QA venv (tools/qa/.venv).
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile

    # Same build id as the worker image: read it from the Dockerfile so they cannot diverge.
    - name: Read chrome-headless-shell version
      if: inputs.media == 'true'
      id: chrome
      shell: bash
      run: |
        chrome_version="$(sed -n 's/^ARG CHROME_HEADLESS_SHELL_VERSION=//p' Dockerfile)"
        test -n "$chrome_version"
        echo "version=$chrome_version" >> "$GITHUB_OUTPUT"

    - name: Cache chrome-headless-shell
      if: inputs.media == 'true'
      id: chrome-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/puppeteer
        key: chrome-headless-shell-${{ runner.os }}-${{ steps.chrome.outputs.version }}

    # Rendering toolchain for the HyperFrames and QA media tests (the runner image already ships Chrome's
    # shared libraries). man-db triggers make apt installs crawl on hosted runners, so they are disabled first.
    - name: Install FFmpeg and chrome-headless-shell
      if: inputs.media == 'true'
      shell: bash
      run: |
        sudo rm -f /var/lib/man-db/auto-update
        # A stalled mirror can hang apt silently until the job times out, so each attempt is bounded and retried.
        for attempt in 1 2 3; do
          if timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq &&
            timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq --no-install-recommends ffmpeg; then
            break
          fi
          [ "$attempt" = 3 ] && exit 1
          echo "apt attempt $attempt failed, retrying"
        done
        if [ "${{ steps.chrome-cache.outputs.cache-hit }}" != "true" ]; then
          # Outside the checkout, so npx fetches the package instead of reusing pnpm's bin-less copy.
          (cd "$RUNNER_TEMP" && npx --yes --package @puppeteer/browsers@3.2.6 -- browsers install "chrome-headless-shell@${{ steps.chrome.outputs.version }}" --path ~/.cache/puppeteer)
        fi

    # An explicit glob: the default one walks the whole checkout, node_modules included, which took up to
    # five minutes per run.
    - uses: astral-sh/setup-uv@v6
      if: inputs.uv == 'true'
      with:
        cache-dependency-glob: tools/qa/uv.lock

    - name: Sync the QA venv
      if: inputs.uv == 'true'
      shell: bash
      run: uv sync --locked --project tools/qa
