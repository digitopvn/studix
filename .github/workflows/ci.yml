# Lint, typecheck, unit + integration tests and build. Never calls paid provider APIs:
# the live test project only runs when STUDIX_LIVE=1, which CI never sets.
# Pull requests into main gate production: deploy.yml trusts that result and does not re-run CI on push.
# During the bootstrap stage pull requests into dev and pushes to dev skip CI; contributors run
# `pnpm check` locally before merging. Remove the dev exclusions to gate dev again.
# Jobs run in parallel; the integration suite is split into shards, each with its own Postgres and MinIO.
name: ci

on:
  pull_request:
    branches-ignore: [dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  # Local-only credentials from docker-compose.yml, not secrets.
  DATABASE_URL: postgres://studix:studix@127.0.0.1:55432/studix
  S3_ENDPOINT: http://127.0.0.1:59000
  S3_REGION: us-east-1
  S3_BUCKET: studix-test
  S3_ACCESS_KEY_ID: studix
  S3_SECRET_ACCESS_KEY: studix-local-secret
  S3_FORCE_PATH_STYLE: "true"
  # The QA media tests fail instead of skipping when ffmpeg or the QA venv is missing.
  STUDIX_QA_REQUIRE_TOOLCHAIN: "1"

jobs:
  static:
    name: lint, typecheck, migrations, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrations match schema
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/database/migrations
          test -z "$(git status --porcelain -- packages/database/migrations)"

      - name: Build
        run: pnpm build

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          media: "true"
          uv: "true"

      # pytest for tools/qa, then the TypeScript unit tests.
      - name: Unit tests
        run: pnpm test

  qa-speech:
    name: QA speech tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          cache-dependency-glob: tools/qa/uv.lock

      # The real Silero VAD on a synthesized voice and on voiceless sound, in its own venv so the main one
      # stays the default image (no torch). Fails, not skips, when the detector or espeak-ng is missing.
      - name: QA speech tests (speech image)
        env:
          STUDIX_QA_REQUIRE_SPEECH: "1"
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/qa-speech-venv
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends espeak-ng ffmpeg
          uv run --locked --extra speech --project tools/qa pytest tools/qa/tests/test_speech_activity.py -v

  integration:
    name: integration tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      # Pulls and starts the services while the toolchain installs.
      - name: Start Postgres and MinIO
        run: docker compose up -d postgres minio

      # uv runs the Python MCP SDK client test against /mcp; the QA venv backs the media checks.
      - uses: ./.github/actions/setup
        with:
          media: "true"
          uv: "true"

      - name: Wait for Postgres and MinIO
        run: |
          docker compose up -d --wait postgres minio
          docker compose run --rm minio-init

      - name: Integration tests
        run: pnpm test:integration --shard=${{ matrix.shard }}/3

      - name: Stop services
        if: always()
        run: docker compose down -v
