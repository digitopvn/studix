# Lint, typecheck, unit + integration tests and build. Never calls paid provider APIs:
# the live test project only runs when STUDIX_LIVE=1, which CI never sets.
# Pushes to main run it through deploy.yml, which deploys only after it passes.
# During the bootstrap stage pull requests into dev and pushes to dev skip CI; contributors run
# `pnpm check` locally before merging. Remove the dev exclusions to gate dev again.
name: ci

on:
  pull_request:
    branches-ignore: [dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      # Local-only credentials from docker-compose.yml, not secrets.
      DATABASE_URL: postgres://studix:studix@127.0.0.1:55432/studix
      S3_ENDPOINT: http://127.0.0.1:59000
      S3_REGION: us-east-1
      S3_BUCKET: studix-test
      S3_ACCESS_KEY_ID: studix
      S3_SECRET_ACCESS_KEY: studix-local-secret
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Rendering toolchain for the HyperFrames integration test: FFmpeg/ffprobe plus
      # chrome-headless-shell (the runner image already ships Chrome's shared libraries).
      # man-db triggers make apt installs crawl on hosted runners, so they are disabled first.
      - name: Install FFmpeg and chrome-headless-shell
        timeout-minutes: 10
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          npx --yes --package @puppeteer/browsers@2.13.0 -- browsers install chrome-headless-shell@stable --path ~/.cache/puppeteer

      # uv runs the Python MCP SDK client test against /mcp.
      - uses: astral-sh/setup-uv@v6

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migrations match schema
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/database/migrations
          test -z "$(git status --porcelain -- packages/database/migrations)"

      - name: Start Postgres and MinIO
        run: |
          docker compose up -d --wait postgres minio
          docker compose run --rm minio-init

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Stop services
        if: always()
        run: docker compose down -v
