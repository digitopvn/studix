# Push to dev deploys the dev environment, push to main deploys production, each only after CI
# passes. TOSE builds the image from the pushed branch (projects have auto-deploy off); the
# environment's variables name the projects and the public URL, its secret holds the TOSE key.
name: deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
      url: ${{ vars.STUDIX_APP_URL }}
    # One deploy per branch at a time; a newer push waits instead of cancelling a rollout.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Deploy app, then worker
        env:
          TOSE_API_KEY: ${{ secrets.TOSE_API_KEY }}
          TOSE_WORKSPACE: ${{ vars.TOSE_WORKSPACE }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node deploy/tose/deploy.ts "${{ vars.TOSE_APP_PROJECT }}" "${{ vars.TOSE_WORKER_PROJECT }}"
      - name: Health check
        env:
          APP_URL: ${{ vars.STUDIX_APP_URL }}
        run: |
          for p in healthz readyz; do
            curl -sf --retry 10 --retry-delay 6 --retry-all-errors --max-time 20 "$APP_URL/$p" -o /dev/null
            echo "$APP_URL/$p ok"
          done
