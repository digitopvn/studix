# Push to dev deploys the dev environment, push to main deploys production. Neither re-runs CI:
# main only receives merged pull requests, whose CI already passed (pre-MVP speed trade-off, see
# docs/DEPLOYMENT.md#ci-deploy); dev skips CI during the bootstrap stage (see ci.yml). TOSE projects have auto-deploy off; the
# environment's variables name the projects and the public URL, its secret holds the TOSE key.
name: deploy

on:
  push:
    branches: [dev, main]
    # Changes that cannot alter the image do not deploy.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "plans/**"
      - ".claude/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # With the environment variable STUDIX_DEPLOY_IMAGE=1, CI builds the image once (layer cache in the
  # GitHub Actions cache), pushes it to GHCR and TOSE deploys that digest to both projects. Otherwise
  # TOSE builds each project from the branch itself (no layer cache, ~15 min per project).
  image:
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.out.outputs.image }}
    steps:
      - id: ref
        if: vars.STUDIX_DEPLOY_IMAGE == '1'
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: vars.STUDIX_DEPLOY_IMAGE == '1'
      - uses: docker/login-action@v3
        if: vars.STUDIX_DEPLOY_IMAGE == '1'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        if: vars.STUDIX_DEPLOY_IMAGE == '1'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ref.outputs.ref }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: out
        if: vars.STUDIX_DEPLOY_IMAGE == '1'
        run: echo "image=${{ steps.ref.outputs.ref }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    # Manual runs from other branches deploy nothing.
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
      url: ${{ vars.STUDIX_APP_URL }}
    # A started rollout is never cancelled; a newer push queues behind it (GitHub keeps only the
    # newest queued run).
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Deploy app and worker
        env:
          TOSE_API_KEY: ${{ secrets.TOSE_API_KEY }}
          TOSE_WORKSPACE: ${{ vars.TOSE_WORKSPACE }}
          APP_PROJECT: ${{ vars.TOSE_APP_PROJECT }}
          WORKER_PROJECT: ${{ vars.TOSE_WORKER_PROJECT }}
          TOSE_IMAGE: ${{ needs.image.outputs.image }}
          TOSE_REGISTRY_CREDENTIAL_ID: ${{ vars.TOSE_REGISTRY_CREDENTIAL_ID }}
          # Lets the script skip a build when the branch moved past the pushed commit.
          EXPECTED_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node deploy/tose/deploy.ts "$APP_PROJECT" "$WORKER_PROJECT"
      - name: Health check
        env:
          APP_URL: ${{ vars.STUDIX_APP_URL }}
        run: |
          for p in healthz readyz; do
            curl -sf --retry 10 --retry-delay 6 --retry-all-errors --max-time 20 "$APP_URL/$p" -o /dev/null
            echo "$APP_URL/$p ok"
          done
