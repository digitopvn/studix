# Local development and integration-test dependencies.
#   docker compose up -d postgres minio   # minio-init creates the bucket once minio is healthy
#   docker compose --profile selfhost up -d --build   # full self-host stack: app + worker + deps
#   docker compose down                   # add -v to drop the data volumes
# Host ports are fixed and offset (55432, 59000, 59001) so they never clash with other local stacks.
# Credentials below are local-only development values, not secrets.
name: studix

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studix
      POSTGRES_PASSWORD: studix
      POSTGRES_DB: studix
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studix -d studix"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The upstream minio/minio Docker Hub images are no longer published; pgsty/minio is a maintained
  # rebuild of the same server. Any S3-compatible endpoint works (R2 in staging).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: studix
      MINIO_ROOT_PASSWORD: studix-local-secret
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 studix studix-local-secret &&
        mc mb --ignore-existing local/studix-local &&
        mc mb --ignore-existing local/studix-test
    restart: "no"

  # --- Self-host stack (profile "selfhost"): one image, two roles. ---
  # Dashboard + /mcp on http://localhost:58080. Override secrets via a .env file next to this compose file.
  app:
    profiles: ["selfhost"]
    build: .
    image: studix:local
    restart: unless-stopped
    environment: &studix-env
      NODE_ENV: production
      STUDIX_ROLE: app
      STUDIX_PUBLIC_URL: ${STUDIX_PUBLIC_URL:-http://localhost:58080}
      STUDIX_APP_URL: ${STUDIX_APP_URL:-http://localhost:58080}
      STUDIX_ALLOWED_HOSTS: ${STUDIX_ALLOWED_HOSTS:-localhost,127.0.0.1}
      STUDIX_MIGRATE_ON_START: "true"
      DATABASE_URL: postgres://studix:studix@postgres:5432/studix
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:59000}
      S3_REGION: us-east-1
      S3_BUCKET: studix-local
      S3_ACCESS_KEY_ID: studix
      S3_SECRET_ACCESS_KEY: studix-local-secret
      S3_FORCE_PATH_STYLE: "true"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-local-only-self-host-secret-0000}
      DECISION_PROVIDERS: ${DECISION_PROVIDERS:-rules}
      DECISION_ROUTES: ${DECISION_ROUTES:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_DECISION_MODEL: ${OPENROUTER_DECISION_MODEL:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_DECISION_MODEL: ${TYPESAFE_DECISION_MODEL:-}
      STUDIX_BRAND_LOOKUP_TOOL: ${STUDIX_BRAND_LOOKUP_TOOL:-}
    ports:
      - "127.0.0.1:58080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    profiles: ["selfhost"]
    image: studix:local
    restart: unless-stopped
    environment:
      <<: *studix-env
      STUDIX_ROLE: worker
      STUDIX_MIGRATE_ON_START: "false"
      # Durable scratch space so synchronous paid audio survives a worker restart.
      WORKER_WORK_DIR: /var/lib/studix/work
    volumes:
      - worker-work:/var/lib/studix/work
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  worker-work:
