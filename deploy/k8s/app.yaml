# STUDIX_ROLE=app: /mcp, /api, dashboard static, runs migrations on start (advisory-locked).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studix-app
  labels: { app.kubernetes.io/name: studix, app.kubernetes.io/component: app }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: studix, app.kubernetes.io/component: app }
  template:
    metadata:
      labels: { app.kubernetes.io/name: studix, app.kubernetes.io/component: app }
    spec:
      containers:
        - name: app
          image: studix
          env:
            - { name: STUDIX_ROLE, value: app }
            - { name: STUDIX_MIGRATE_ON_START, value: "true" }
          envFrom:
            - secretRef: { name: studix-env }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: studix-app
spec:
  selector: { app.kubernetes.io/name: studix, app.kubernetes.io/component: app }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Host comes from your environment; replace before applying (hostnames are config, not code).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studix-app
spec:
  rules:
    - host: studix.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: studix-app, port: { name: http } }
