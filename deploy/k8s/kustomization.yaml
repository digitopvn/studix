# Generic Kubernetes manifests for Studix (self-host or any K8s cluster).
# TOSE staging builds the same root Dockerfile per project; see docs/DEPLOYMENT.md.
#   kubectl create secret generic studix-env --from-env-file=.env   # never commit the .env
#   kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - app.yaml
  - worker.yaml
images:
  - name: studix
    newName: ghcr.io/digitopvn/studix
    newTag: latest
