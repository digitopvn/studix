# STUDIX_ROLE=worker: claims jobs from Postgres, renders with HyperFrames + FFmpeg, uploads to S3.
# Jobs survive pod restarts: leases expire and another worker resumes from the last checkpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studix-worker
  labels: { app.kubernetes.io/name: studix, app.kubernetes.io/component: worker }
spec:
  replicas: 1
  # The work volume is ReadWriteOnce: the old pod must release it before the new one starts.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: studix, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: studix, app.kubernetes.io/component: worker }
    spec:
      terminationGracePeriodSeconds: 60
      securityContext: { fsGroup: 1000 }
      containers:
        - name: worker
          image: studix
          env:
            - { name: STUDIX_ROLE, value: worker }
            - { name: STUDIX_MIGRATE_ON_START, value: "false" }
          envFrom:
            - secretRef: { name: studix-env }
          volumeMounts:
            - { name: work, mountPath: /var/lib/studix/work }
          ports:
            - { name: health, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "1", memory: 1536Mi }
            limits: { cpu: "2", memory: 3Gi }
      volumes:
        - name: work
          persistentVolumeClaim: { claimName: studix-worker-work }
---
# Job scratch space. It must outlive a pod: a synchronous Multix call (voice, music, sfx) is only known to be
# finished while its output file is still here, and the upstream has no idempotency key, so losing the file
# means paying for the call again. Finished jobs delete their directories and the worker sweeps failed ones
# after WORKER_WORK_DIR_RETENTION_HOURS, so the size bounds in-flight work, not history.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: studix-worker-work
  labels: { app.kubernetes.io/name: studix, app.kubernetes.io/component: worker }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 20Gi }
