[project]
name = "studix-qa"
version = "0.1.0"
description = "Studix QA measurement tools: JSON in, JSON out, run by the worker inside a sandbox."
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3"]

[project.optional-dependencies]
# Only the optional worker image installs this (docker build --build-arg STUDIX_QA_EXTRAS=depth).
depth = ["torch>=2.5", "transformers>=4.46", "pillow>=11"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studix_qa"]

# CPU wheels: the PyPI torch wheel for Linux bundles CUDA, which a CPU worker never uses.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
